services:
  postgres-ecommerce:
    volumes:
      - ./init-postgres/:/docker-entrypoint-initdb.d
    image: postgres:16-alpine
    container_name: postgres-ecommerce
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - "5433:5432"
    networks:
      - microservices-net

  eureka-service:
    build:
      context: ./eureka-service
    container_name: eureka-service
    restart: always
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    restart: always
    ports:
      - "8080:8080"
    networks:
      - microservices-net
    depends_on:
      - eureka-service

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: always
    ports:
      - "8081:8081"
    networks:
      - microservices-net
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-ecommerce:5432/${POSTGRES_DATABASE_USER:-user_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USER: ${POSTGRES_USER:-ecommerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SHOPPING_CART_SERVICE_URL: http://shopping-cart-service:8083
      PRODUCT_CATALOG_SERVICE_URL: http://product-catalog-service:8082
    depends_on:
      - postgres-ecommerce
      - rabbitmq
      - eureka-service
      - shopping-cart-service
      - product-catalog-service

  product-catalog-service:
    build:
      context: ./product-catalog-service
    container_name: product-catalog-service
    restart: always
    ports:
      - "8082:8082"
    networks:
      - microservices-net
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-ecommerce:5432/${POSTGRES_DATABASE_PRODUCT:-product_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USER: ${POSTGRES_USER:-ecommerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    depends_on:
      - postgres-ecommerce
      - eureka-service

  shopping-cart-service:
    build:
      context: ./shopping-cart-service
    container_name: shopping-cart-service
    restart: always
    ports:
      - "8083:8083"
    networks:
      - microservices-net
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-ecommerce:5432/${POSTGRES_DATABASE_CART:-cart_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USER: ${POSTGRES_USER:-ecommerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      - postgres-ecommerce
      - rabbitmq
      - eureka-service

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    restart: always
    ports:
      - "8085:8085"
    networks:
      - microservices-net
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-ecommerce:5432/${POSTGRES_DATABASE_ORDER:-order_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USER: ${POSTGRES_USER:-ecommerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      - postgres-ecommerce
      - rabbitmq
      - eureka-service

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    restart: always
    ports:
      - "8086:8086"
    networks:
      - microservices-net
    environment:
      DATABASE_URL: jdbc:postgresql://postgres-ecommerce:5432/${POSTGRES_DATABASE_PAYMENT:-payment_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USER: ${POSTGRES_USER:-ecommerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      - postgres-ecommerce
      - rabbitmq
      - eureka-service

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - microservices-net

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: always
    ports:
      - "8084:8084"
    networks:
      - microservices-net
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8080}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-noreply@ecommerce.com}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-console}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      - rabbitmq
      - eureka-service

networks:
  microservices-net:
    driver: bridge
