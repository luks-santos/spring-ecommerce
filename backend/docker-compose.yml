version: '3.8'

services:
  mysql-ecommerce:
    volumes:
      - ./init-mysql/:/docker-entrypoint-initdb.d
    image: mysql:8.0-debian
    container_name: mysql-ecommerce
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    networks:
      - microservices-net

  eureka-service:
    build:
      context: ./eureka-service
    container_name: eureka-service
    restart: always
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    restart: always
    ports:
      - "8080:8080"
    networks:
      - microservices-net
    depends_on:
      - eureka-service

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: always
    env_file:
      - .env
    ports:
      - "8081:8080"
    networks:
      - microservices-net
    environment:
      DATABASE_URL: jdbc:mysql://mysql-ecommerce:3306/${MYSQL_DATABASE_USER}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql-ecommerce
      - eureka-service

  product-catalog-service:
    build:
      context: ./product-catalog-service
    container_name: product-catalog-service
    restart: always
    env_file:
      - .env
    ports:
      - "8082:8082"
    networks:
      - microservices-net
    environment:
      DATABASE_URL: jdbc:mysql://mysql-ecommerce:3306/${MYSQL_DATABASE_PRODUCT}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql-ecommerce
      - eureka-service

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - microservices-net

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: always
    env_file:
      - .env
    ports:
      - "8084:8084"
    networks:
      - microservices-net
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:8080}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-noreply@ecommerce.com}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-console}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
    depends_on:
      - rabbitmq
      - eureka-service

networks:
  microservices-net:
    driver: bridge